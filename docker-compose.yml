version: "3.9"

services:
  db:
    image: postgres:16
    container_name: skillmarkets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillmarkets
      POSTGRES_PASSWORD: skillmarkets
      POSTGRES_DB: skillmarkets
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
